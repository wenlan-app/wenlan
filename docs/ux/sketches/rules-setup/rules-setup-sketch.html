<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules Setup Sketch</title>
<style>
:root{
  --bg:#FCFCFB;--surface:#FFFFFF;--sidebar:#FFFFFF;--text:#1A1A2E;--text2:#586174;--text3:#687184;
  --border:#E3E7EE;--accent:#5E58C8;--sage:#6F8F76;--sage-text:#486D50;--amber:#B5842E;--raised:#F7F8FA;
  --warn-bg:rgba(181,132,46,.12);--warn-text:#8C5F16;--ok-text:#4F7558;--add:rgba(118,184,110,.20);--del:rgba(205,92,74,.16);
  --danger:#B42318;--frame:#EEF0F4;
  --font:'Instrument Sans',-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;
}
:root[data-theme="dark"]{
  --bg:#191C24;--surface:#202430;--sidebar:#161920;--text:#F1EFE8;--text2:#C9C8D1;--text3:#969BAD;
  --border:#333A4B;--accent:#8FB3EA;--sage:#9DA990;--sage-text:#BBC7AE;--amber:#C7AA5C;--raised:#252B3B;
  --warn-bg:rgba(199,170,92,.15);--warn-text:#DCC36F;--ok-text:#BBC7AE;--add:rgba(118,184,110,.24);--del:rgba(205,92,74,.22);
  --danger:#F0A0A0;--frame:#10121A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--frame)}
.bar h1{font-size:15px;font-weight:600;margin:0 auto 0 0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--text2);font:13px var(--font);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);font-weight:600}
.states{display:flex;flex-direction:column;gap:36px;padding:8px 20px 60px;max-width:1080px;margin:0 auto}
.label{font-size:13px;color:var(--text3);margin:0 0 8px 4px}
.label b{color:var(--text);font-weight:600;margin-right:8px}
.win{display:flex;min-height:420px;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.side{width:188px;flex:none;background:var(--sidebar);padding:18px 10px;border-right:1px solid var(--border)}
.side .brand{font-weight:600;font-size:14px;padding:0 10px 14px}
.side a{display:block;padding:6px 10px;border-radius:6px;color:var(--text2);text-decoration:none;font-size:13.5px}
.side a.on{background:var(--raised);color:var(--text);font-weight:600}
.side .gap{height:18px}
.main{flex:1;min-width:0;padding:26px 34px 34px}
.main h2{font-size:20px;font-weight:600;margin:0 0 14px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tools .lead{font-size:13px;color:var(--text3);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:13px;white-space:nowrap;position:relative}
svg.logo{width:14px;height:14px;flex:none}
.card .t svg.logo{width:16px;height:16px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:8px;font-weight:700;line-height:1}
.dot.ok{background:var(--sage);color:var(--surface)}
.dot.ring{border:1.5px solid var(--text3)}
.dot.warn{background:var(--amber);color:var(--surface)}
.chip.attn{border-color:var(--amber)}
.status{font-size:13px;color:var(--text3);margin:-12px 0 20px}
.status.ok{color:var(--ok-text)}
.hover{position:absolute;top:36px;left:0;z-index:3;min-width:220px;max-width:330px;padding:12px 14px 13px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);white-space:normal}
.hover .h{display:flex;gap:7px;align-items:center;font-weight:600;font-size:14px}
.hover .s{font-size:13px;color:var(--text2);margin-top:4px}
.hover .d{font-size:12.5px;color:var(--text3);margin-top:6px}
.rule{padding:10px 0;font-size:14px;color:var(--text)}
.rule small{display:block;color:var(--text3);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:22px}
.card.attn{border-color:color-mix(in srgb,var(--amber) 55%,var(--border))}
.card .t{font-weight:600;font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card .why{font-size:13.5px;color:var(--text2);margin:0 0 12px}
.diff{background:var(--raised);border-radius:8px;padding:8px 0;font-size:13px;margin:0 0 14px}
.diff div{padding:2px 12px}
.diff .a{background:var(--add)}
.diff .r{background:var(--del)}
.diff .c{color:var(--text3)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:13.5px var(--font);border-radius:7px;padding:6px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#141720}
.btn.quiet{border-color:transparent;background:none;color:var(--text2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#141720}
.note{font-size:12.5px;color:var(--text3);margin-top:10px}
.skill{display:flex;align-items:center;gap:12px;padding:10px 0}
.skill .n{font-weight:600;font-size:14px}
.skill .x{font-size:13px;color:var(--text3)}
.skill .grow{flex:1;min-width:0}
.badge{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn-text);white-space:nowrap}
.list{margin:0 0 14px;padding:0;list-style:none;font-size:13.5px}
.list li{display:flex;gap:10px;padding:4px 0;align-items:baseline}
.list .k{flex:none;width:96px;color:var(--text3)}
.list .k.w{width:120px}
.sec{font-size:13px;font-weight:600;color:var(--text2);margin:14px 0 6px}
.settings{max-width:620px}
.settings .row{display:flex;align-items:center;gap:16px;padding:12px 0}
.settings .row .grow{flex:1}
.settings .row .sub{font-size:13px;color:var(--text3)}
.modal-wrap{position:relative}
.scrim{position:absolute;inset:-26px -34px -34px;background:rgba(10,12,18,.32);display:grid;place-items:center}
.modal{width:440px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.modal .t{font-weight:600;font-size:16px;margin:0 0 6px}
.modal p{margin:0 0 12px;font-size:13.5px;color:var(--text2)}
.modal .btns{justify-content:flex-end;margin-top:16px}
[data-oneline]{white-space:nowrap}
@media (max-width:760px){.side{display:none}.main{padding:20px 16px}.states{padding:8px 10px 40px}.modal{width:auto;max-width:92%}}
</style>
</head>
<body>
<div class="bar">
  <h1 data-i="pageTitle"></h1>
  <div class="seg" id="lang"><button data-v="zh">繁中</button><button data-v="en">English</button></div>
  <div class="seg" id="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
</div>
<div class="states" id="states"></div>

function logo(k){const l=LOGOS[k];if(!l)return "";const c=(theme==="dark"?l.dark:l.light)||"currentColor";
  return `<svg class="logo" viewBox="${l.viewBox||"0 0 24 24"}" aria-hidden="true">${l.paths.map(p=>`<path fill="${p.fill||c}" ${p.evenOdd?`fill-rule="evenodd" clip-rule="evenodd"`:""} d="${p.d}"/>`).join("")}</svg>`}
function chip(k,name,dot,attn,inner){const d={ok:'<span class="dot ok">✓</span>',ring:'<span class="dot ring"></span>',warn:'<span class="dot warn">!</span>'}[dot];
  return `<span class="chip${attn?" attn":""}">${logo(k)}<span>${name}</span>${d}${inner||""}</span>`}
const TOOLS=[["claude-code","Claude Code"],["codex","Codex"],["cursor","Cursor"],["opencode","OpenCode"],["gemini-cli","Gemini CLI"]];
function tools(t,attnKey,hover){return `<div class="tools"><span class="lead">${t.usedIn}</span>${TOOLS.map(([k,n])=>chip(k,n,k===attnKey?"warn":"ok",k===attnKey,k==="gemini-cli"?hover:"")).join("")}</div>`}
function side(t,on){const a=(k)=>`<a class="${on===k?"on":""}">${t[k]}</a>`;return `<nav class="side"><div class="brand">Wenlan</div>${a("sDocs")}${a("sSkills")}${a("sRules")}<div class="gap"></div>${a("sSettings")}</nav>`}
function rules(t){return [["r1","r1s"],["r3","r3s"]].map(([a,b])=>`<div class="rule">${t[a]}<small>${t[b]}</small></div>`).join("")}
function win(t,on,body){return `<div class="win">${side(t,on)}<div class="main">${body}</div></div>`}

function render(){
  const t=T[lang];document.documentElement.lang=lang==="zh"?"zh-Hant":"en";document.documentElement.dataset.theme=theme;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  for(const [id,v] of [["lang",lang],["theme",theme]])document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  const hover=`<div class="hover"><div class="h">${logo("gemini-cli")}${t.hvTitle}</div><div class="s">${t.hvState}</div><div class="d">${t.hvDetail}</div></div>`;
  const s1=win(t,"sRules",`<h2>${t.rulesH}</h2>`+tools(t,null,hover)+`<div class="status ok" data-oneline>${t.st1}</div><div style="height:70px"></div>`+rules(t)+`<div class="rule">${t.r2}<small>${t.r2s}</small></div>`);
  const s2=win(t,"sRules",`<h2>${t.rulesH}</h2>`+tools(t,"cursor")+`<div class="status" data-oneline>${t.st2}</div>
    <div class="card attn"><div class="t">${logo("cursor")}<span data-oneline>${t.revT}</span></div><p class="why">${t.revWhy}</p>
    <div class="diff"><div class="r">− ${t.revOld}</div><div class="a">+ ${t.revNew}</div><div class="c">${t.revCtx}</div></div>
    <div class="btns"><button class="btn">${t.revA}</button><button class="btn primary">${t.revB}</button><button class="btn quiet">${t.revC}</button></div>
    <div class="note">${t.revNote}</div></div>`+rules(t));
  const sk=(n,x,b)=>`<div class="skill"><div class="grow"><div class="n">${t[n]}</div><div class="x">${t[x]}</div></div>${b||""}</div>`;
  const s3=win(t,"sSkills",`<h2>${t.skillsH}</h2>`+tools(t)+`<div class="status" data-oneline>${t.st3}</div>
    <div class="card"><div class="t"><span data-oneline>${t.updT}</span></div><p class="why">${t.updWhy}</p>
    <div class="diff"><div class="r">− ${t.updOld}</div><div class="a">+ ${t.updNew}</div></div>
    <div class="btns"><button class="btn primary">${t.updA}</button><button class="btn quiet">${t.updB}</button></div></div>`
    +sk("sk1","sk1x")+sk("sk2","sk2x",`<span class="badge">${t.newVer}</span>`)+sk("sk3","sk3x"));
  const li=(k,v,w)=>`<li><span class="k${w?" w":""}" data-oneline>${t[k]}</span><span>${t[v]}</span></li>`;
  const settingsRows=`<div class="row"><div class="grow"><div data-oneline>${t.adoptRow}</div><div class="sub">${t.adoptSub}</div></div><button class="btn">${t.adoptBtn}</button></div>
    <div class="row"><div class="grow"><div data-oneline>${t.restoreRow}</div><div class="sub">${t.restoreSub}</div></div><button class="btn">${t.restoreBtn}</button></div>`;
  const s4=win(t,"sSettings",`<h2>${t.settingsH}</h2><div class="settings"><div class="card"><div class="t"><span data-oneline>${t.adT}</span></div>
    <div class="sec">${t.adSecTo}</div><ul class="list">${li("adTo1","adTo1v")}${li("adTo2","adTo2v")}${li("adTo3","adTo3v")}</ul>
    <div class="sec">${t.adSecSkip}</div><ul class="list">${li("adSk1","adSk1v")}${li("adSk2","adSk2v")}</ul>
    <p class="why">${t.adKeep}</p><div class="btns"><button class="btn primary">${t.adA}</button><button class="btn quiet">${t.adB}</button></div></div></div>`);
  const s5=win(t,"sSettings",`<div class="modal-wrap"><h2>${t.settingsH}</h2><div class="settings">${settingsRows}</div><div style="height:120px"></div>
    <div class="scrim"><div class="modal"><div class="t">${t.rsT}</div><p>${t.rsP}</p><p>${t.rsP2}</p>
    <div class="btns"><button class="btn quiet">${t.rsB}</button><button class="btn danger">${t.rsA}</button></div></div></div></div>`);
  const L=(n,html)=>`<section><div class="label"><b>${n}. ${t["L"+n]}</b>${t["L"+n+"d"]}</div>${html}</section>`;
  document.getElementById("states").innerHTML=L(1,s1)+L(2,s2)+L(3,s3)+L(4,s4)+L(5,s5);
}
for(const id of ["lang","theme"])document.getElementById(id).addEventListener("click",e=>{const v=e.target.dataset.v;if(!v)return;
  if(id==="lang")lang=v;else theme=v;try{localStorage.setItem("rs-"+id,v)}catch(_){}render()});
render();
</script>
</body>
</html>
