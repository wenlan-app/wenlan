<svg width="720" height="256" viewBox="0 0 720 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wenlan README banner</title>
  <desc id="desc">Wenlan: 文件、技能和規則， 你的 AI 工具幫你更新，也拿來做事</desc>
  <rect width="720" height="256" fill="#151D2B"/>
  <g transform="translate(332 8) scale(0.109375)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#banner-zh-Hant-mobile-ring)" stroke-width="76"/>
    <circle cx="322" cy="160" r="42" fill="url(#banner-zh-Hant-mobile-orb)"/>
  </g>
  <text x="360" y="90" fill="#93E3F2" font-size="24" font-weight="500" text-anchor="middle"><tspan font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif">Wenlan</tspan><tspan dx="6" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif">文瀾</tspan></text>
  <text x="360" y="120" fill="#BAC4D2" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400" text-anchor="middle">你和 AI 一起想、一起學、一起做的地方</text>
  <text x="360" y="156" fill="#F7F8FF" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="500" text-anchor="middle">文件、技能和規則，</text>
  <text x="360" y="189" fill="#F7F8FF" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="500" text-anchor="middle">你的 AI 工具幫你更新，也拿來做事</text>
  <text x="360" y="224" fill="#BAC4D2" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400" text-anchor="middle">免費・開源・個人和團隊都能用</text>
  <defs>
    <linearGradient id="banner-zh-Hant-mobile-ring" x1="96" y1="256" x2="416" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#5BA3E6"/>
      <stop offset="1" stop-color="#4AC8E8"/>
    </linearGradient>
    <radialGradient id="banner-zh-Hant-mobile-orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 144) rotate(52.125) scale(76.0263)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#A5C4F7"/>
      <stop offset="1" stop-color="#4AC8E8"/>
    </radialGradient>
  </defs>
</svg>
