<svg width="1120" height="260" viewBox="0 0 1120 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wenlan README banner</title>
  <desc id="desc">Wenlan: 文件、技能和規則， 你的 AI 工具幫你更新，也拿來做事</desc>
  <rect width="1120" height="260" fill="#151D2B"/>
  <g transform="translate(172 -45)"><g transform="translate(62 70) scale(0.4140625)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#banner-zh-Hant-desktop-ring)" stroke-width="76"/>
    <circle cx="322" cy="160" r="42" fill="url(#banner-zh-Hant-desktop-orb)"/>
  </g>
  <text x="300" y="123" fill="#93E3F2" font-size="40" font-weight="500" text-anchor="start"><tspan font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif">Wenlan</tspan><tspan dx="10" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif">文瀾</tspan></text>
  <text x="300" y="170" fill="#F7F8FF" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="500" text-anchor="start">文件、技能和規則，</text>
  <text x="300" y="212" fill="#F7F8FF" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="500" text-anchor="start">你的 AI 工具幫你更新，也拿來做事</text>
  <text x="300" y="254" fill="#BAC4D2" font-family="&quot;PingFang TC&quot;, &quot;Noto Sans TC&quot;, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" text-anchor="start">免費・開源・個人和團隊都能用</text></g>
  <defs>
    <linearGradient id="banner-zh-Hant-desktop-ring" x1="96" y1="256" x2="416" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#5BA3E6"/>
      <stop offset="1" stop-color="#4AC8E8"/>
    </linearGradient>
    <radialGradient id="banner-zh-Hant-desktop-orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 144) rotate(52.125) scale(76.0263)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#A5C4F7"/>
      <stop offset="1" stop-color="#4AC8E8"/>
    </radialGradient>
  </defs>
</svg>
