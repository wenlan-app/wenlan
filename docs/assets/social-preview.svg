  <text x="300" y="170" fill="#F7F8FF" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="36" font-weight="500" text-anchor="start">The knowledge base</text>
