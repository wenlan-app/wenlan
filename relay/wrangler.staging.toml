# Isolated staging service. Never copy production OAuth data or secrets here.
name = "wenlan-relay-staging"
account_id = "8ccecf6c1d98fc9b84533e55dec1b2ac"
main = "src/worker.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["enable_request_signal"]
workers_dev = true
preview_urls = false

[vars]
PUBLIC_ORIGIN = "https://wenlan-relay-staging.wenlan-app.workers.dev"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "b338f8dae5c74aa88bf914ecb8371f5a"

[[durable_objects.bindings]]
name = "AUTHORITY"
class_name = "RelayAuthority"

[[migrations]]
tag = "wenlan-authority-v1"
new_sqlite_classes = ["RelayAuthority"]

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false

# Only the relay's own one-line request records (route, status, which limit
# fired). Invocation logs stay off so Cloudflare does not record request URLs
# or headers. See README "Request logs".
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
